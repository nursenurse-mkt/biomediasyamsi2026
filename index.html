<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Biomedia Syamsi 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --black:#0d0d0d;
  --red:#c30018;
}

body{
  margin:0;
  font-family:"Inter","Segoe UI",sans-serif;
  background:#f2f2f2;
  color:#111;
}

.container{
  max-width:960px;
  margin:40px auto;
  background:#fff;
  border-radius:18px;
  padding:40px;
  box-shadow:0 25px 60px rgba(0,0,0,.15);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

h1{margin:0;font-size:28px}

.lang-switch button{
  margin-left:8px;
  padding:6px 14px;
  border-radius:999px;
  border:1px solid var(--black);
  background:#fff;
  cursor:pointer;
  font-weight:600;
}

.lang-switch button.active{
  background:var(--black);
  color:#fff;
}

.card{
  border:1px solid #e3e3e3;

}

.badge{

  border-radius:999px;
  font-size:13px;
  margin-bottom:14px;
}

label{font-size:14px;font-weight:600}

input,select{
  width:100%;
  padding:12px;
  margin:6px 0 18px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
}

button.main{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:var(--red);
  color:#fff;
  font-size:16px;

}

button.secondary{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid var(--black);

  margin-top:10px;
  cursor:pointer;
}

.result{

.footer{
  text-align:center;

</head>

/* ===== FUNCTIONS ===== */
function generateFortune(){
  const n=parseInt(document.getElementById("fortuneNumber").value);
  const box=document.getElementById("fortuneResult");
  if(!n||n<1||n>30){
    alert(lang==="th"?"กรุณาใส่เลข 1–30":"Please enter a number between 1–30");
    return;
  }
  lastFortuneNumber=n;
  box.innerText=fortunes[n][lang];
}

function setLang(l){
  lang=l;
  document.getElementById("thBtn").classList.toggle("active",l==="th");
  document.getElementById("enBtn").classList.toggle("active",l==="en");

  document.getElementById("labelNumber").innerText =
    l==="th"?"ใส่เลขที่ท่านได้รับ (1–30)":"Enter your number (1–30)";
  document.getElementById("analyzeBtn").innerText =
    l==="th"?"วิเคราะห์ผล":"Analyze";

  if(lastFortuneNumber){
    document.getElementById("fortuneResult").innerText =
      fortunes[lastFortuneNumber][lang];
  }
}

function toggleOther(){
  document.getElementById("otherBox").style.display =
    document.getElementById("product").value==="Other"?"block":"none";
}
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTZLFlzHmIfVeCEo1KsEZK66LPfyy-y-tWAsBNqvrif-UWwIphQyGlnjcQtBmxayWQGA/exec";

function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function isValidPhone(phone){
  return /^[0-9]{9,10}$/.test(phone);
}

function submitData(){
  const name = fullname.value.trim();
  const emailVal = email.value.trim();
  const phoneVal = phone.value.trim();
  const org = organization.value.trim();
  const prod = product.value;
  const other = otherProduct.value.trim();

  /* ===== REQUIRED (ยกเว้น other) ===== */
  if(!name || !emailVal || !phoneVal || !org || !prod){
    alert(lang==="th"
      ? "กรุณากรอกข้อมูลให้ครบถ้วน"
      : "Please fill in all required fields"
    );
    return;
  }

  /* ===== EMAIL ===== */
  if(!isValidEmail(emailVal)){
    alert(lang==="th"
      ? "รูปแบบอีเมลไม่ถูกต้อง"
      : "Invalid email format"
    );
    return;
  }

  /* ===== PHONE ===== */
  if(!isValidPhone(phoneVal)){
    alert(lang==="th"
      ? "กรุณากรอกเบอร์โทร 9–10 หลัก"
      : "Phone number must be 9–10 digits"
    );
    return;
  }

  /* ===== OTHER (บังคับเฉพาะเมื่อเลือก Other) ===== */
  if(prod === "Other" && !other){
    alert(lang==="th"
      ? "กรุณาระบุสินค้าอื่น"
      : "Please specify other product"
    );
    return;
  }

  /* ===== SEND TO GOOGLE SCRIPT ===== */
  const payload = {
    name: name,
    email: emailVal,
    phone: phoneVal,
    organization: org,
    product: prod,
    other: prod === "Other" ? other : ""
  };

  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify(payload)
  })
  .then(res=>res.json())
  .then(res=>{
    if(res.status==="success"){
      alert(lang==="th"
        ? "ส่งข้อมูลเรียบร้อย ✅"
        : "Submitted successfully ✅"
      );

      // clear form
      document.querySelectorAll("input,select").forEach(el=>{
        if(el.type!=="button") el.value="";
      });
      toggleOther();
    }else{
      throw new Error();
    }
  })
  .catch(()=>{
    alert(lang==="th"
      ? "เกิดข้อผิดพลาด ❌"
      : "Submission failed ❌"
    );
  });
}
  function generateLuckyNumbers(){

    let rand = Math.floor(Math.random() * 30) + 1;
    if(!numbers.includes(rand)){
      numbers.push(rand);
    }
  }

  numbers.sort((a,b)=>a-b);

  const resultText = lang==="th"
    ? "Lucky Numbers ของคุณคือ:\n" + numbers.join(" • ")
    : "Your Lucky Numbers are:\n" + numbers.join(" • ");

  document.getElementById("luckyResult").innerText = resultText;
}
</script>
